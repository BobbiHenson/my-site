<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Z-OLD — Joining</title>
	<style>
		:root {
			--bg0: #0a090b;
			--bg1: #141116;
			--red: #c83737;
			--red-soft: rgba(200, 55, 55, 0.35);
			--text: #ece8ea;
			--muted: #9a9196;
			--bar: #e8e4e6;
		}

		* { box-sizing: border-box; margin: 0; padding: 0; }

		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: var(--bg0);
			color: var(--text);
			font-family: "Bahnschrift", "Segoe UI", system-ui, sans-serif;
		}

		body {
			display: flex;
			align-items: center;
			justify-content: center;
			background:
				radial-gradient(ellipse 80% 55% at 50% 35%, rgba(160, 40, 40, 0.22), transparent 60%),
				radial-gradient(ellipse 100% 80% at 50% 100%, rgba(20, 10, 12, 0.95), var(--bg0));
		}

		.noise {
			pointer-events: none;
			position: fixed;
			inset: 0;
			opacity: 0.045;
			background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
		}

		.wrap {
			position: relative;
			z-index: 1;
			width: min(720px, 92vw);
			text-align: center;
			padding: 2rem 1.5rem 2.5rem;
		}

		.brand {
			font-size: clamp(2.6rem, 8vw, 4.2rem);
			font-weight: 800;
			letter-spacing: 0.02em;
			line-height: 1;
			margin-bottom: 0.35rem;
		}

		.brand .z { color: var(--red); }

		.headline {
			font-size: clamp(1.15rem, 3.2vw, 1.55rem);
			font-weight: 600;
			letter-spacing: 0.04em;
			margin: 1.2rem 0 0.35rem;
		}

		.dots::after {
			content: "";
			display: inline-block;
			width: 1.4em;
			text-align: left;
			animation: dots 1.4s steps(4, end) infinite;
		}

		.meta {
			color: var(--muted);
			font-size: 0.92rem;
			margin-bottom: 1.6rem;
			min-height: 1.2em;
		}

		.progress-block {
			text-align: left;
			background: rgba(255,255,255,0.03);
			border: 1px solid rgba(255,255,255,0.07);
			border-radius: 10px;
			padding: 1rem 1.1rem 1.15rem;
			backdrop-filter: blur(6px);
		}

		.progress-top {
			display: flex;
			justify-content: space-between;
			align-items: baseline;
			gap: 1rem;
			margin-bottom: 0.55rem;
			font-size: 0.88rem;
		}

		.progress-top .label { color: var(--muted); }
		.progress-top .pct {
			font-weight: 700;
			font-variant-numeric: tabular-nums;
			color: var(--text);
		}

		.bar {
			height: 10px;
			border-radius: 999px;
			background: rgba(255,255,255,0.08);
			overflow: hidden;
			position: relative;
		}

		.bar > i {
			display: block;
			height: 100%;
			width: 0%;
			border-radius: inherit;
			background: linear-gradient(90deg, #8b2020, var(--red), #f0a0a0);
			box-shadow: 0 0 16px var(--red-soft);
			transition: width 0.25s ease;
		}

		.bar > i.indeterminate {
			width: 35% !important;
			animation: slide 1.3s ease-in-out infinite;
		}

		.file {
			margin-top: 0.7rem;
			font-size: 0.78rem;
			color: var(--muted);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
		}

		.status {
			margin-top: 0.45rem;
			font-size: 0.85rem;
			color: #cfc6ca;
			min-height: 1.2em;
		}

		.footer {
			margin-top: 1.4rem;
			font-size: 0.75rem;
			color: rgba(154, 145, 150, 0.7);
		}

		@keyframes dots {
			0% { content: ""; }
			25% { content: "."; }
			50% { content: ".."; }
			75% { content: "..."; }
		}

		@keyframes slide {
			0% { transform: translateX(-120%); }
			100% { transform: translateX(320%); }
		}
	</style>
</head>
<body>
	<div class="noise"></div>
	<div class="wrap">
		<div class="brand"><span class="z">Z</span>-OLD</div>

		<div class="headline dots">You join to Z-OLD</div>
		<div class="meta" id="meta">Connecting…</div>

		<div class="progress-block">
			<div class="progress-top">
				<span class="label" id="filesLabel">Preparing downloads</span>
				<span class="pct" id="pct">0%</span>
			</div>
			<div class="bar"><i id="barFill" class="indeterminate"></i></div>
			<div class="file" id="fileName">Waiting for files…</div>
			<div class="status" id="status"></div>
		</div>

		<div class="footer">by BobbiHenson · have fun</div>
	</div>

	<script>
		var totalFiles = 0;
		var neededFiles = 0;
		var hasTotals = false;

		function $(id) { return document.getElementById(id); }

		function updateProgress() {
			var fill = $("barFill");
			var pctEl = $("pct");
			var filesLabel = $("filesLabel");

			if (!hasTotals || totalFiles <= 0) {
				fill.classList.add("indeterminate");
				pctEl.textContent = "…";
				filesLabel.textContent = "Preparing downloads";
				return;
			}

			fill.classList.remove("indeterminate");
			var done = Math.max(0, totalFiles - neededFiles);
			var pct = Math.max(0, Math.min(100, Math.round((done / totalFiles) * 100)));
			fill.style.width = pct + "%";
			pctEl.textContent = pct + "%";
			filesLabel.textContent = done + " / " + totalFiles + " files";
		}

		function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
			var parts = [];
			if (servername) parts.push(servername);
			if (mapname) parts.push(mapname);
			if (gamemode) parts.push(gamemode);
			if (maxplayers) parts.push(maxplayers + " slots");
			$("meta").textContent = parts.join("  ·  ") || "Entering the server…";
		}

		function SetFilesTotal(total) {
			totalFiles = Number(total) || 0;
			hasTotals = totalFiles > 0;
			updateProgress();
		}

		function SetFilesNeeded(needed) {
			neededFiles = Number(needed) || 0;
			hasTotals = true;
			updateProgress();
		}

		function DownloadingFile(fileName) {
			if (!fileName) return;
			var clean = String(fileName)
				.replace(/\.bz2$/i, "")
				.replace(/\.ztmp$/i, "")
				.replace(/\\/g, "/");
			$("fileName").textContent = "Downloading: " + clean;
			$("status").textContent = "";
		}

		function SetStatusChanged(status) {
			if (!status) return;
			$("status").textContent = status;
			if (!hasTotals) {
				$("fileName").textContent = status;
			}
		}

		// Expose for GMod engine
		window.GameDetails = GameDetails;
		window.SetFilesTotal = SetFilesTotal;
		window.SetFilesNeeded = SetFilesNeeded;
		window.DownloadingFile = DownloadingFile;
		window.SetStatusChanged = SetStatusChanged;
	</script>
</body>
</html>
